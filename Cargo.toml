[package]
name = "cho"
version = "0.1.0"
edition = "2024"
description = "A tiny command-line tool for filtering and formatting text with Lisp-like expressions"
license = "MIT"
repository = "https://github.com/k0f1sh/cho"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1.3"
ipnet = "2.11"
regex = "1.11"
