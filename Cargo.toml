[package]
name = "cho"
version = "0.33.0"
edition = "2024"
description = "A small, type-aware text processor for the command line"
license = "MIT"
repository = "https://github.com/k0f1sh/cho"
default-run = "cho"

[features]
documentation = ["dep:serde", "dep:serde_json"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
csv = "1.3"
ipnet = "2.11"
regex = "1.11"
rust_decimal = { version = "1.37", default-features = false, features = ["std"] }
semver = "1.0"
url = "2.5"
uuid = { version = "1.26", features = ["v4", "v7"] }
ulid = "3.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "generate-documentation"
path = "tools/generate-documentation.rs"
required-features = ["documentation"]
